name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ['5433:5432']
        options: >-
          --health-cmd 'pg_isready -U atlas -d atlas_test'
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5433/atlas_test
      DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5433/atlas_test
      STRICT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m alembic upgrade head
      - run: python -m pytest -q -W error -m 'not browser'
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ['5433:5432']
        options: >-
          --health-cmd 'pg_isready -U atlas -d atlas_test'
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5433/atlas_test
      DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5433/atlas_test
      STRICT_TESTS: '1'
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m alembic upgrade head
      - run: python -m pytest -q -W error tests/test*browser*.py tests/test_frontend.py tests/test_packaging.py
