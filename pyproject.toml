[build-system]
requires = ["setuptools>=77,<86"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research"
version = "0.1.0"
description = "An evidence-backed research workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["database: requires PostgreSQL via TEST_DATABASE_URL"]
